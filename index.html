<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Конфигуратор</title>
<style>
:root{--bg:#0b1018;--p:#111927;--p2:#172234;--ln:#26344a;--tx:#e8eef8;--mu:#91a0b7;--bl:#4f8cff;--gn:#35c77b;--rd:#f0646a;--pu:#9b7bff;--ctrl-h:32px}
html[data-theme="light"]{--bg:#eef2f7;--p:#ffffff;--p2:#f3f6fb;--ln:#d5dde8;--tx:#1a2332;--mu:#5d6f86;--bl:#2f6fed;--gn:#1fa05a;--rd:#d6454f;--pu:#6f56d6}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 Inter,"Segoe UI",sans-serif;overflow:hidden}
*{scrollbar-width:thin;scrollbar-color:#243548 transparent}
*::-webkit-scrollbar{width:6px;height:6px}
*::-webkit-scrollbar-track{background:transparent}
*::-webkit-scrollbar-thumb{background:#243548;border-radius:99px}
*::-webkit-scrollbar-thumb:hover{background:#334860}
button,input,select{font:inherit;color:var(--tx)}button{cursor:pointer}
.app{height:100vh;display:grid;grid-template-rows:56px 1fr}
.app-body{min-height:0;display:grid;grid-template-columns:var(--rw,60px) minmax(0,1fr)}
.pane{min-width:0;min-height:0;display:grid;grid-template-rows:minmax(0,1fr) 48px}
header{display:flex;align-items:center;gap:12px;padding:0 14px;background:var(--p);border-bottom:1px solid var(--ln);position:relative;z-index:30}
.logo{display:flex;align-items:center;font-weight:700}.logo b{width:32px;height:32px;display:grid;place-items:center;background:transparent}
.logo b svg,.logo b img{display:block;width:32px;height:32px}
.hr-tools{display:flex;align-items:center;gap:8px;flex:none;margin-left:auto}
/* Строка запроса: всегда на виду, сразу за логотипом, как промпт в чате */
.omni{position:relative;flex:1 1 auto;min-width:0;max-width:660px}
.omni-box{display:flex;align-items:center;gap:8px;height:38px;padding:0 6px 0 12px;border:1px solid #2a3b55;border-radius:12px;background:#0d1521;box-shadow:inset 0 1px 3px #0008;transition:border-color .12s,box-shadow .12s}
.omni-box:hover{border-color:#36507a}
.omni-box.focus{border-color:#4a7ab8;box-shadow:inset 0 1px 3px #0008,0 0 0 3px #2a4a7833}
.omni-lead{flex:none;display:inline-flex;color:#5c7390;line-height:0}
.omni-lead svg{width:15px;height:15px;display:block}
.omni-box input{flex:1;min-width:0;height:100%;border:0;border-radius:0;background:transparent;box-shadow:none;padding:0;font-size:13.5px}
.omni-box input::placeholder{color:#6a7d97}
.omni-clear{flex:none;border:0;background:transparent;color:var(--mu);font-size:12px;line-height:1;padding:5px 7px;border-radius:6px}
.omni-clear:hover{color:var(--tx);background:#1b2942}
.omni-clear.hide{display:none}
.omni-pop{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--p);border:1px solid var(--ln);border-radius:12px;box-shadow:0 18px 48px #000b;overflow:hidden}
.omni-pop[hidden]{display:none}
/* Разделы — лентой слева сверху вниз, только значки; название в подсказке */
.rail{display:flex;flex-direction:column;gap:2px;padding:8px 6px;background:#080c13;border-right:1px solid var(--ln);overflow:auto}
.rl{display:grid;place-items:center;width:100%;height:44px;border:0;background:transparent;color:var(--mu);border-radius:10px;padding:0;transition:background .12s,color .12s}
.rl-ic{line-height:0}
.rl-ic svg{width:22px;height:22px;display:block}
.rl:hover{color:var(--tx);background:#141d2b}
.rl.on{color:#fff;background:#18304f;box-shadow:inset 0 0 0 1px #2c4f7d}
.rl-low{margin-top:auto}
.flash{animation:flashBox 1.6s ease-out}
@keyframes flashBox{0%,55%{box-shadow:0 0 0 2px var(--bl);border-radius:8px}100%{box-shadow:0 0 0 2px transparent}}
html[data-theme="light"] .rail{background:#e7ecf4}
html[data-theme="light"] .rl:hover{background:#dbe4f0;color:var(--tx)}
html[data-theme="light"] .rl.on{background:#2f6fed;color:#fff;box-shadow:none}
html[data-theme="light"] .omni-box{background:#fff;border-color:var(--ln);box-shadow:none}
html[data-theme="light"] .omni-box.focus{box-shadow:0 0 0 3px #2f6fed22}
html[data-theme="light"] .omni-clear:hover{background:#e8eef8}
html[data-theme="light"] .ubtn:hover,html[data-theme="light"] .ubtn.on{background:#e8f0ff;border-color:#b7cff5}
html[data-theme="light"] .uav{background:#dce6f5;color:#3a4d66}
html[data-theme="light"] .usign{border-color:#e0a0a6;color:#b33a44}
html[data-theme="light"] .usign:hover{background:#fdecee}
.umenu{position:relative;flex:none}
.ubtn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--ln);background:var(--p2);border-radius:999px;padding:4px 10px 4px 4px;color:var(--tx);cursor:pointer}
.ubtn:hover,.ubtn.on{border-color:#3f6fac;background:#162945}
.uav{width:26px;height:26px;border-radius:50%;background:#2a3b55;display:grid;place-items:center;font-size:13px;flex:none;color:#c5d4ea}
.uname{font-size:13px;font-weight:600;max-width:120px;overflow:hidden;text-overflow:ellipsis}
.uchev{font-size:10px;color:var(--mu)}
.upop{display:none;position:absolute;right:0;top:calc(100% + 8px);z-index:50;width:240px;background:var(--p);border:1px solid var(--ln);border-radius:12px;box-shadow:0 14px 36px #000a;padding:12px;flex-direction:column;gap:10px}
.upop.open{display:flex}
.uhead{display:flex;align-items:center;gap:10px;padding-bottom:8px;border-bottom:1px solid var(--ln)}
.uhead .uav{width:34px;height:34px;font-size:15px}
.uhead b{font-size:14px}
.upop label{display:block;font-size:12px;color:var(--mu);margin:0}
.upop label select{margin-top:4px}
.usign{margin-top:2px;width:100%;border:1px solid #7a3a42;background:transparent;color:#ff9ca1;border-radius:8px;padding:8px 10px}
.usign:hover{background:#3a1d25}
.ws{min-height:0;display:grid;grid-template-columns:var(--aw,360px) 4px 1fr}.ws.one{grid-template-columns:1fr}.ws.one .rsz{display:none}
aside,main{min-height:0;overflow:hidden}aside{background:#0b1018;border-right:1px solid var(--ln);display:flex;flex-direction:column;container-type:inline-size}
/* Узкая панель: у кнопок срезов остаются подписи, картинки уступают место тексту */
@container (max-width:430px){.view-sw .fchip .ici{display:none}.view-sw .fchip{padding:6px 5px}}
.rsz{width:4px;cursor:col-resize;background:transparent;position:relative;z-index:2}
.rsz:hover,.rsz.on{background:var(--bl)}
.box{padding:4px 8px;border-bottom:1px solid var(--ln);flex:none}
.srch{display:flex;gap:4px}.srch input{flex:1;height:var(--ctrl-h);padding:0 10px;font-size:13px;box-sizing:border-box}
.srch .btn{padding:0 10px;height:var(--ctrl-h);flex:none;box-sizing:border-box}
.filt{display:grid;grid-template-columns:1.35fr 1.2fr 1fr;gap:4px;margin-bottom:4px}
.view-sw{display:flex;flex-wrap:wrap;flex:none;gap:2px;padding:10px 8px 0;margin:0;border:0;border-radius:0;background:#0b1018}
.view-sw .fchip{flex:1 1 auto;min-width:58px;border:0;border-radius:8px;background:transparent;color:var(--mu);min-height:32px;padding:6px 7px;font-size:12px;line-height:1.2;text-align:center;font-weight:600;display:flex;align-items:center;justify-content:center;gap:5px;cursor:pointer;transition:background .12s,color .12s}
.view-sw .fchip .ici{flex:none;line-height:0;opacity:.92}
.view-sw .fchip .ici .ic-svg{width:15px;height:15px;display:block}
.view-sw .fchip span{flex:none;white-space:normal;text-align:center}
.view-sw .fchip:hover:not(.on){color:var(--tx);background:#172234}
.view-sw .fchip.on{color:#fff;background:#1a2d4d}
.gear-body{flex:1;display:flex;flex-direction:column;min-height:0;background:#0b1018}
.gear-tree-head{flex:none;padding:8px 8px 6px}
.grp-sw{display:flex;gap:4px;margin:0 0 6px;padding:2px;border:1px solid #1e2d42;border-radius:7px;background:#0a1018}
.grp-b{flex:1 1 0;min-width:0;display:flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:5px;background:transparent;color:var(--mu);padding:5px 8px;font-size:11px;font-weight:600;line-height:1.2;cursor:pointer}
.grp-b .ici{flex:none;line-height:0;opacity:.85}
.grp-b .ici .ic-svg{width:13px;height:13px;display:block}
.grp-b:hover:not(.on){color:var(--tx);background:#152232}
.grp-b.on{color:#fff;background:#1a2d4d}
html[data-theme="light"] .grp-sw{border-color:var(--ln);background:var(--p2)}
html[data-theme="light"] .grp-b:hover:not(.on){background:#e8eef8;color:var(--tx)}
html[data-theme="light"] .grp-b.on{background:#2f6fed;color:#fff}
.gear-tree-head .sq{min-height:28px;border-radius:6px;background:#0b1018;border:1px solid transparent;box-shadow:none;transition:background .12s,border-color .12s,box-shadow .12s}
.gear-tree-head .sq:hover{background:#152232}
.gear-tree-head .sq:focus-within{border-color:#4a7ab8;background:#0b1018;box-shadow:0 0 0 1px #2a4a7855}
.gear-tree-head .sq-menu{border-left:0;transition:background .12s,color .12s}
.gear-tree-head .sq-menu:hover,.gear-tree-head .sq-menu.on{background:#152030}
.fchip{border:1px solid var(--ln);background:var(--p2);color:var(--mu);min-height:var(--ctrl-h);padding:0 8px;border-radius:6px;font-size:11px;line-height:1.2;text-align:center;font-weight:600;display:flex;align-items:center;justify-content:center}
.fchip.on{color:#fff;border-color:#3f6fac;background:#162945}
.sq-wrap{position:relative;margin-top:0}
.sq{display:flex;align-items:stretch;border:1px solid #1e2d42;border-radius:8px;background:#0a1018;overflow:hidden;min-height:var(--ctrl-h);box-shadow:inset 0 1px 3px #0009}
.sq:focus-within{border-color:#4a7ab8;box-shadow:inset 0 1px 3px #0009,0 0 0 2px #2a4a7833}
.sq-lead{flex:none;display:inline-flex;align-items:center;padding:0 0 0 10px;color:#5c7390;pointer-events:none}
.sq-lead svg,.sq-menu svg{width:14px;height:14px;display:block;opacity:.9}
.sq > input{flex:1;min-width:0;width:auto;height:auto;align-self:stretch;padding:0 8px 0 4px;font-size:13px;box-sizing:border-box;border:0;border-radius:0;background:transparent;outline:0;box-shadow:none;appearance:none;-webkit-appearance:none;color:var(--tx)}
.sq > input::placeholder{color:#5f738a}
.sq-clear{flex:none;display:inline-flex;align-items:center;justify-content:center;width:22px;border:0;background:transparent;color:var(--mu);padding:0;cursor:pointer;font-size:14px;line-height:1}
.sq-clear:hover{color:#fff}
.sq-clear.hide{display:none}
.dev-sq-wrap .sq{align-items:center}
.sq-focus-wrap{flex:none;display:flex;align-items:center;padding:3px 2px 3px 6px}
.sq-focus-wrap.sq-filt-wrap{padding:3px 6px 3px 2px}
.sq-focus-wrap.is-reserved,.dev-bulk-act.is-reserved{visibility:hidden;pointer-events:none}
.sq-focus{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border:0;border-radius:5px;background:transparent;color:#5c7390;cursor:pointer;padding:0;flex:none;box-sizing:border-box}
.sq-focus:hover:not(.on):not(.hot){color:var(--tx);background:#152030}
.sq-focus.on,.sq-focus.hot{color:#9ec8ff;background:#1a3150}
.sq-focus.on:hover,.sq-focus.hot:hover{color:#9ec8ff;background:#1f3a5c}
.sq-focus svg{width:18px;height:18px;display:block}
html[data-theme="light"] .sq-focus{background:transparent;color:#6b8199}
html[data-theme="light"] .sq-focus:hover:not(.on):not(.hot){background:#e7effa;color:#1a3358}
html[data-theme="light"] .sq-focus.on,html[data-theme="light"] .sq-focus.hot{background:#dce8f7;color:#2f5fad}
html[data-theme="light"] .sq-focus.on:hover,html[data-theme="light"] .sq-focus.hot:hover{background:#c4d8f4;color:#1a3358}
.sq-menu{position:relative;flex:none;display:inline-flex;align-items:center;align-self:stretch;justify-content:center;border:0;border-left:1px solid #243448;background:transparent;color:#5c7390;padding:0;width:36px;cursor:pointer}
.sq-menu:hover,.sq-menu.on{background:#152030;color:#9ec8ff}
.sq-menu.hot{color:#9ec8ff}
.sq-menu.hot:after{content:"";position:absolute;top:5px;right:5px;width:5px;height:5px;border-radius:50%;background:var(--bl)}
.filt-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.filt-tags:empty{display:none;margin:0}
.ftag{display:inline-flex;align-items:center;gap:4px;max-width:100%;padding:2px 6px;border-radius:4px;background:#1a3a5c;border:1px solid #2f5f8f;color:#c5dcff;font-size:10px}
.ftag span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ftag button{border:0;background:0;color:#9ec0e8;padding:0;line-height:1;cursor:pointer;font-size:11px}
.filt-pop{display:none;position:fixed;z-index:40;width:min(312px,calc(100vw - 24px));max-height:min(560px,82vh);background:var(--p);border:1px solid var(--ln);border-radius:8px;box-shadow:0 12px 32px #000a;padding:0;flex-direction:column;overflow:hidden}
.filt-pop.open{display:flex}
.filt-sec{display:flex;flex-direction:column;flex:none;min-height:0;border-bottom:1px solid #2a3a52;background:#0e1622}
.filt-sec+.filt-sec{background:#111a28}
.filt-sec.extra{background:#0c141f;flex:none;margin-top:auto;border-bottom:0;border-top:1px solid #2a3a52}
.filt-sec.types{min-height:0;flex:1 1 auto;overflow:hidden}
.filt-sec.types.expanded{flex:1 1 auto;overflow:hidden}
.filt-sec .sec{flex:none;padding:8px 10px 4px;font-size:10px;color:#a8b8d0;font-weight:600;letter-spacing:.04em;text-transform:uppercase;border-bottom:1px solid #1c2838}
.filt-sec.chips{display:grid;grid-template-columns:5.8em 1fr;align-items:start;column-gap:8px;padding:8px 10px;border-bottom:1px solid #2a3a52}
.filt-sec.chips .sec{padding:5px 0 0;border:0;line-height:1.25;white-space:normal}
.filt-sec.chips .filt-status{padding:0;min-width:0}
.filt-sec.fields.chips{border-bottom:1px solid #3a4d66}
.filt-sec.status.chips{border-bottom:1px solid #3a4d66}
.filt-sec.types.chips{border-bottom:1px solid #2a3a52}
.filt-sec.types.chips .filt-more{grid-column:1/-1;padding:2px 0 0}
.filt-sec.types.chips.expanded .filt-status{max-height:min(180px,32vh);overflow:auto;scrollbar-width:thin;scrollbar-color:#3a4d66 transparent}
.filt-sec-body{overflow:hidden;padding:2px 4px;min-height:0}
.filt-sec.types.expanded .filt-sec-body{overflow:auto;flex:1 1 auto;max-height:min(220px,36vh);scrollbar-width:thin;scrollbar-color:#3a4d66 transparent}
.filt-sec.types.expanded .filt-sec-body::-webkit-scrollbar{width:5px}
.filt-sec.types.expanded .filt-sec-body::-webkit-scrollbar-track{background:transparent}
.filt-sec.types.expanded .filt-sec-body::-webkit-scrollbar-thumb{background:#3a4d66;border-radius:99px}
.filt-sec.types.expanded .filt-sec-body::-webkit-scrollbar-thumb:hover{background:#4d6482}
.filt-more{display:flex;align-items:center;gap:6px;width:100%;padding:2px 10px 6px;border:0;background:0;color:#7aa2d4;font-size:11px;cursor:pointer;text-align:left;flex:none}
.filt-more:hover{color:#b7d2f5}
.filt-more .chev{font-size:10px;opacity:.75}
.filt-sec.fields{background:#0e1622}
.filt-status{display:flex;flex-wrap:wrap;gap:5px;padding:6px 8px 8px}
.stchip-ic{flex:none;display:inline-flex;align-items:center;padding:0 0 0 7px;line-height:0;opacity:.9}
.stchip-ic .ic-svg,.stchip-ic .ici .ic-svg{width:11px;height:11px}
.stchip.has-ic .stchip-lab{padding-left:5px}
.stchip{display:inline-flex;align-items:center;gap:0;border:1px solid #2a3d55;background:#152030;color:#9aacbf;border-radius:99px;padding:0;font-size:11px;font-weight:600;line-height:1.3;cursor:pointer;overflow:hidden}
.stchip-lab{border:0;background:0;color:inherit;font:inherit;font-weight:600;padding:4px 9px;cursor:pointer;line-height:1.3}
.stchip.has-eye .stchip-lab{padding-right:4px}
.stchip-eye{flex:none;display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;margin:0 3px 0 0;padding:0;border:0;border-radius:99px;background:transparent;color:inherit;opacity:.45;cursor:pointer;line-height:0}
.stchip-eye svg{width:12px;height:12px;display:block}
.stchip-eye:hover{opacity:.95;background:#ffffff14}
.stchip-eye.on{opacity:1;color:#9ec8ff;background:#ffffff12}
.stchip:hover{color:#e8eef8;border-color:#3d628f;background:#1a2d44}
.stchip.on{color:#fff;background:#1a3a5c;border-color:#3f6fac}
.stchip:disabled,.stchip.dis{opacity:.38;cursor:not-allowed;color:#6d7d90;border-color:#243446;background:#121c28}
.stchip:disabled:hover,.stchip.dis:hover{color:#6d7d90;border-color:#243446;background:#121c28}
.stchip.on-nosignal{background:#3a1d25;border-color:#7a3a42;color:#ff9ca1}
.stchip.on-license{background:#3a3220;border-color:#7a6a3a;color:#e6c86a}
.filt-foot{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 8px 8px}
.filt-foot .mi{width:auto!important;flex:none}
.filt-foot .btn{flex:none;white-space:nowrap}
.filt-pop .mi{display:flex;align-items:center;gap:4px;width:100%;padding:2px 4px 2px 6px;border:0;background:0;color:var(--tx);font-size:12px;line-height:1.25;text-align:left;border-radius:4px}
.filt-pop .mi:hover{background:#172a46}
.filt-pop .mi.on{background:#1a2d4d}
.filt-pop .mi-lab{display:flex;align-items:center;gap:6px;flex:1;min-width:0;cursor:pointer;padding:1px 0}
.filt-pop .mi input{width:auto;margin:0;accent-color:var(--bl);flex:none;transform:scale(.9)}
.filt-pop .mi .ic{width:12px;flex:none;opacity:.85;text-align:center;font-size:11px}
.filt-pop .mi span.lbl{flex:1;min-width:0}
.filt-pop .mi-eye{flex:none;display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;padding:0;border:0;border-radius:4px;background:transparent;color:#5a6f8a;cursor:pointer;line-height:0}
.filt-pop .mi-eye svg{width:14px;height:14px;display:block}
.filt-pop .mi-eye:hover{color:#c5dcff;background:#1a2d4d}
.filt-pop .mi-eye.on{color:#9ec8ff;background:#1a2d4d}
.filt-hint{font-size:10px;color:var(--mu);margin-top:3px}
.filt-hint:empty{display:none;margin:0}
.tree{flex:1;overflow:auto;min-height:0;scrollbar-width:thin;scrollbar-color:#2f3f55 transparent}
.tree::-webkit-scrollbar{width:6px}
.tree::-webkit-scrollbar-track{background:transparent}
.tree::-webkit-scrollbar-thumb{background:#2f3f55;border-radius:99px}
.tree::-webkit-scrollbar-thumb:hover{background:#3d536e}
.n{display:flex;align-items:center;flex-wrap:nowrap;gap:5px;height:28px;padding:0 6px 0 8px;border-left:3px solid transparent;cursor:pointer;color:#c7d1e0;font-size:12px;user-select:none;min-width:0}
.n .tw{display:inline-flex;align-items:center;justify-content:center;width:11px;flex:none;cursor:pointer;user-select:none}
.n:hover{background:#142033}.n.on{background:#152232;border-left-color:var(--bl);color:#e8eef8}.n.mark{background:#15263c;border-left-color:#3d6a9e;color:#e8eef8}.n.on.mark{background:#182a3a;border-left-color:var(--bl);color:#fff}
.n.off .nm,.n.off .nm-inp{color:#8a96a8}
.n.off .ici>.ic-svg{opacity:.55}
.n-add{color:var(--bl);font-weight:600;font-size:12px}.n-add:hover{background:#162945;color:#9ec8ff}.n-add .nm{color:inherit}
.lk-add{border:0;background:0;color:var(--bl);font-weight:600;font-size:inherit;padding:0;cursor:pointer;text-align:left;font-family:inherit}
.lk-add:hover{color:#9ec8ff}
.n-empty{padding-left:22px;height:24px;color:var(--mu);font-size:11px;font-style:italic;cursor:default}
.n-empty:hover{background:transparent}
.n-add.srv{font-weight:600;font-size:12px}
.tctx{display:none;position:fixed;z-index:45;min-width:220px;max-height:min(70vh,420px);overflow:auto;background:var(--p);border:1px solid var(--ln);border-radius:8px;box-shadow:0 10px 28px #000a;padding:4px 0;scrollbar-width:thin;scrollbar-color:#2f3f55 transparent}
.tctx.open{display:block}
.tctx button{display:flex;align-items:center;gap:8px;width:100%;border:0;background:0;color:var(--tx);padding:7px 10px 7px 8px;font-size:12px;text-align:left;cursor:pointer}

function expandTo(id,ctx){
  let f=find(id);if(!f)return;
  let p=f.p?find(f.p.id):null;
  while(p){open.add(p.n.id);p=p.p?find(p.p.id):null}
  // Раскрываем только ту ветку, по которой кликнули
  if(ctx){
    const[kind,key]=[ctx.slice(0,ctx.indexOf(":")),ctx.slice(ctx.indexOf(":")+1)];
    if(kind==="gpu"){const sv=servers.find(x=>x.id===key);if(sv){const dm=domainOf(sv.id);if(dm)open.add(dm.id);open.add(sv.id);open.add(gpuId(sv.id))}return}
    if(kind==="arch"){const a=archById(key),ow=archOwner(a);if(ow){const dm=ow.type==="domain"?ow:domainOf(ow.id);if(dm)open.add(dm.id);open.add(ow.id);open.add(key)}return}
    if(kind==="norec"){open.add(key);open.add(norecId(key));return}
    if(kind==="nf"){open.add(key);open.add(nofolderId(key));return}
    if(kind==="f"){const fd=folderById(key);if(fd){const dm=folderDomain(key);if(dm)open.add(dm.id);folderPath(key).forEach(x=>open.add(x.id))}return}
  }
  const root=path(id)[0];if(!root)return;
  if(root.type==="folder"){const d=folderDomain(root.id);if(d)open.add(d);return}
  if(["domain","server","unalloc","archive","norec","nofolder"].includes(root.type))return;
  // Устройство: раскрываем домен и путь по папкам либо ветку записи
  const did=deviceDomain(id);if(did)open.add(did);
  const own=foldersOfDevice(id);
  own.forEach(fd=>folderPath(fd.id).forEach(x=>open.add(x.id)));
  if(!own.length&&did)open.add(nofolderId(did));
  const sv=srv(id);
  if(sv){open.add(sv.id);const dom=domainOf(sv.id);if(dom)open.add(dom.id)}
  else if(did)open.add(norecId(did));
  let node=find(id)?.n;
  if(node&&node.type==="camera"&&node.arch)open.add(node.arch);
  // Детектор виден в ветке GPU того сервера, где он считается
  if(node&&node.type==="det"){
    const cam=find(id)?.p,sid=cam?detServerId(cam,node):null;
    const gs=sid?servers.find(x=>x.id===sid):null;
    if(gs){open.add(gs.id);const dm=domainOf(gs.id);if(dm)open.add(dm.id);if(serverGpu(gs))open.add(gpuId(gs.id))}
    if(cam)open.add(cam.id);
  }
}

function crumbsHtml(id){
  let parts=path(id);
  const f=find(id);
  if(groupBy==="folder"&&f){
    if(f.n.type==="folder"){
      const d=domains.find(x=>x.id===folderDomain(id));
      if(d)parts=[d,...parts];
    }else if(f.n.type!=="domain"){
      const rootId=parts[0].id,own=foldersOfDevice(rootId);
      const cur=selFolder&&own.some(x=>x.id===selFolder)?folderById(selFolder):own[0];
      const d=domains.find(x=>x.id===deviceDomain(rootId));
      parts=[...(cur?folderPath(cur.id):[]),...parts];
      if(d)parts=[d,...(cur?[]:[nofolderNode(d.id)]),...parts];
    }
  }
  if(groupBy==="server"&&f&&f.n.type==="det"){
    const cam=f.p,sid=cam?detServerId(cam,f.n):null;
    const gs=sid?servers.find(x=>x.id===sid):null;
    if(gs)parts=[domainOf(gs.id),gs,...(serverGpu(gs)?[gpuNode(gs)]:[]),cam,f.n].filter(Boolean);
  }
  if(groupBy==="server"&&f&&f.n.type==="camera"){
    const sv=srv(id),a=arch.find(x=>x.id===f.n.arch);
    const d=sv?domainOf(sv.id):domains.find(x=>x.id===deviceDomain(id));
    if(sv&&a)parts=[d,sv,a,...parts].filter(Boolean);
    else if(d)parts=[d,norecNode(d.id),...parts];
  }
  if(parts.length<2)return"";
  return parts.map((n,i)=>{
    const label=escHtml(locName(n));
    if(i===parts.length-1)return`<span class="cr-cur">${label}</span>`;
    return`<button type="button" class="cr-link" onclick="pick('${n.id}')">${label}</button><span class="cr-sep">/</span>`;
  }).join("");
}

function keepSelInView(){
  const f=find(sel);
  if(!f){sel=domains[0]?.id||sel;return}
  const n=f.n;
  if(n.type==="domain"||n.type==="folder"&&groupBy==="folder")return;
  const ok=whereShown(n).some(x=>(!x.slice||x.slice===slice)&&(!x.group||x.group===groupBy));
  if(ok)return;
  const chain=path(n.id),up=chain.slice(0,-1).reverse().find(p=>whereShown(p).some(x=>(!x.slice||x.slice===slice)&&(!x.group||x.group===groupBy)));
  sel=up?.id||deviceDomain(n.id)||SERVER_DOMAIN[chain[0]?.id]||domains[0]?.id||sel;
}

function pick(id,opts){
  if(treeRenameId&&treeRenameId!==id){
    const el=document.querySelector(".nm-inp");
    if(el)commitTreeRename(treeRenameId,el.value);
  }
  closeTreeCtx();
  const f=find(id);if(!f)return;
  const range=!!opts?.range,additive=!!opts?.additive,multi=range||additive;
  if(range&&canMultiPick(f.n)){
    const ids=visibleMultiIds();
    if(!treeAnchor||!ids.includes(treeAnchor))treeAnchor=ids.includes(sel)?sel:id;
    applyShiftRange(id);
  }else if(additive&&canMultiPick(f.n)){
    const ids=visibleMultiIds();
    if(!treeSel.size&&ids.includes(sel))treeSel.add(sel);
    if(treeSel.has(id)&&treeSel.size>1)treeSel.delete(id);
    else treeSel.add(id);
    treeAnchor=id;
  }else resetTreeSel(id);
  selCtx=opts?.ctx||null;
  if(selCtx&&selCtx.startsWith("f:"))selFolder=selCtx.slice(2);
  if(f.n.type==="folder")selFolder=id;
  else{const own=foldersOfDevice(path(id)[0].id);if(own.length&&!own.some(x=>x.id===selFolder))selFolder=own[0].id}
  pushRecent(id);sel=id;tab="gen";setD(false);expandTo(id,selCtx);
  if(multi&&canMultiPick(f.n)){renderTree();gear();return}
  paint();
}

function bdg(n){

    const ok=n.online!==false;
    return `<span class="bd ${ok?"":"off"}">${ok?i18n("Есть сигнал"):infraNoSignalLabel(n)}</span>`;
  }
  const st=nodeStatus(n),bits=[];
  if(st.ruleOff)bits.push(i18n("Отключено по правилу"));
  else bits.push(st.on?i18n("Включен"):i18n("Выключен"));
  if(st.nosignal)bits.push(i18n("нет сигнала"));
  else if(st.on)bits.push(i18n("есть сигнал"));

  const bad=st.off||st.nosignal||st.license;
  return `<span class="bd ${bad?"off":""}">${bits.join(" · ")}</span>`;
}

function treeNodeHasKids(n){

function bindTreeDbl(){
  const treeEl=document.getElementById("tree");
  if(!treeEl||treeEl._dblBound)return;
  treeEl._dblBound=true;
  // Выбор — сразу по клику; второй клик по той же строке раскрывает/сворачивает её.
  // Двойной клик сам не ловим: после первого клика строка перерисована.
  let lastClick={id:null,t:0};
  treeEl.addEventListener("mousedown",e=>{
    if(e.target.closest(".fav-b"))return;
    if(!(e.shiftKey||e.ctrlKey||e.metaKey))return;
    if(e.target.closest(".tw"))return;
    if(e.target.closest(".n-add"))return;
    if(e.target.closest(".nm-inp"))return;
    const row=e.target.closest(".n[data-pick]");
    if(!row)return;
    const id=row.dataset.pick,f=find(id);
    if(!f||!canMultiPick(f.n))return;
    e.preventDefault();
    lastClick={id:null,t:0};
    pick(id,{range:e.shiftKey,additive:!e.shiftKey&&(e.ctrlKey||e.metaKey),ctx:row.dataset.ctx});
  });
  treeEl.addEventListener("click",e=>{
    const star=e.target.closest(".fav-b");
    if(star){toggleFav(star.dataset.fid,star.dataset.fctx||"",e);return}
    if(e.target.closest(".tw"))return;
    if(e.target.closest(".n-add"))return;
    if(e.target.closest(".nm-inp"))return;
    if(e.shiftKey||e.ctrlKey||e.metaKey)return;
    const row=e.target.closest(".n[data-pick]");
    if(!row)return;
    const id=row.dataset.pick,ctx=row.dataset.ctx||"",now=Date.now();
    if(lastClick.id===id+"|"+ctx&&now-lastClick.t<400){
      lastClick={id:null,t:0};
      if(row.dataset.tid)treeDblToggle(row.dataset.tid,row.dataset.tkind||"node",e);
      return;
    }
    lastClick={id:id+"|"+ctx,t:now};
    pick(id,{ctx:ctx||undefined});
  });
  treeEl.addEventListener("dblclick",e=>{e.preventDefault()});
}
function addTreeLabel(n){
  if(!n||n.type==="domain"||n.type==="unalloc")return i18n("Добавить сервер");
  if(n.type==="server")return i18n("Добавить службу");
  if(n.type==="folder")return slice==="acfa"?i18n("Добавить ACFA"):i18n("Добавить устройство");
  if(slice==="acfa"||n.type==="acfa"||ACFA_NODE_IDS.has(n.id))return i18n("Добавить ACFA");
  if(slice==="sys"||isSvc(n))return i18n("Добавить службу");

}

// ── Дерево «Устройства»: папки физического расположения ────────────────────

function folderDeviceIds(f,acc){
  acc=acc||new Set();
  (f.items||[]).forEach(id=>acc.add(id));
  (f.folders||[]).forEach(x=>folderDeviceIds(x,acc));
  return acc;
}
function folderCount(f){

function folderHasTreeIn(f){
  // Пустая папка видна, пока дерево не сужено типом/статусом
  if(!(f.items||[]).length&&!(f.folders||[]).length)return!treeFiltOn();
  if(folderDeviceNodes(f).some(hasTreeIn))return true;
  return(f.folders||[]).some(folderHasTreeIn);

function frow(f,l,force){

  // папка остаётся видимой, если её имя нашли поиском
  if(!folderHasTreeIn(f)&&!selfHit)return"";
  const subs=(f.folders||[]).map(x=>frow(x,l+1,childForce)).filter(Boolean).join("");
  const devs=folderDeviceNodes(f).filter(d=>hasTreeIn(d)&&(childForce||!q||vis(d,q)));
  if(q&&!childForce&&!subs&&!devs.length)return"";
  const hasKids=!!subs||!!devs.length;
  // Найденную папку раскрываем; вложенные в неё — нет, пока внутри нет своих совпадений
  const auto=q?(selfHit||!force):treeFiltOn();
  const op=hasKids&&(open.has(f.id)||auto);
  let h=`<div class="n srv fld ${sel===f.id?"on":""}${selfHit?" qhit":""}${treeRenameId===f.id?" renaming":""}" style="padding-left:${pad}px"${treeRowPick(f.id)}${treeCtxAttr(f.id)}${treeExpandMeta(f.id,"dom",hasKids)}>
    ${treeChevron(f.id,"dom",hasKids,op)}

  if(op){

    h+=devs.map(d=>nrow(d,l+1,"f:"+f.id,childForce)).join("");
    h+=addTreeRow(l+1,f);

}

// ── Дерево «Сервера» ──────────────────────────────────────────────────────
// Режим «Камеры»: домен → сервер → архив → камеры, которые на него пишутся.
// Режим «Службы»: домен → сервер → службы сервера.
// Правила те же, что в «Устройствах»: найденный по имени контейнер (домен, сервер, архив,
// GPU, NVR, «Без записи») раскрывается и показывает всё содержимое — force у потомков
function scamrow(n,l,ctx,force){
  const q=qval(),pad=8+l*14;
  if(!selfInView(n))return"";
  const hit=!!q&&matchesSearch(n,q);
  if(q&&!force&&!hit)return"";

    <span class="tw"></span>${treeIconHtml(n)}<span class="nm">${displayNameHtml(n,q)}</span>${favStarHtml(n.id,ctx)}${treeRowMeta(n,q,0,false)}</div>`;

// Раскрывать ли контейнер при поиске: найден сам или (не под найденным предком) есть совпадения внутри
function qAutoOpen(q,selfHit,force,anyInside){return!!q&&(selfHit||(!force&&anyInside))}
function srvDetHit(d,q){return!!q&&nameInScope()&&textHit(locName(d),q)}
// Камеры регистратора показываем под ним: репликация встроенного архива

function groupCamsByIpsrv(cams){
  const groups=[],byId=new Map(),loose=[];
  cams.forEach(c=>{
    const owner=ipsrvOwnerNode(c);
    if(!owner){loose.push(c);return}
    if(!byId.has(owner.id)){const g={owner,cams:[]};byId.set(owner.id,g);groups.push(g)}
    byId.get(owner.id).cams.push(c);
  });
  return{groups,loose};
}
// Ветка без видимого содержимого при активном поиске или фильтре только мешает
function hideEmptyBranch(q,selfHit,anyInside){return!anyInside&&(q?!selfHit:treeFiltOn())}

  const vis=cams.filter(c=>selfInView(c)&&(childForce||!q||matchesSearch(c,q)));
  if(hideEmptyBranch(q,selfHit&&selfInView(owner),vis.length))return"";
  const op=open.has(owner.id)||qAutoOpen(q,selfHit,force,!!vis.length)||(treeFiltOn()&&!q&&!!vis.length);

function arow(a,l,force){

  const cols=[["ip","ip"],["port","port"],["vendor","vendor"],["model","model"],["id","devId"],["lat","lat"],["lon","lon"],["azimuth","azimuth"]];
  if(!cols.every(([fk,rk])=>textHit(String(r[rk]??""),filt[fk]||"")))return false;
  const nameQ=(filt.name||"").trim().toLowerCase();
  if(nameQ&&!String(r.label??"").toLowerCase().includes(nameQ)&&!String(r.name??"").toLowerCase().includes(nameQ)&&!String(r.short??"").toLowerCase().includes(nameQ))return false;

function getCamsTableRows(server,opts={}){

  if(filtering){

    const keep=new Set(hit.map(r=>r.id));

function addDetector(camId){
  const f=find(camId);if(!f||f.n.type!=="camera")return;
  const d={id:"det"+Date.now(),type:"det",name:i18n("Новый детектор"),kind:DET_TYPES[0],sens:"12",online:true,devices:[]};
  (f.n.devices||(f.n.devices=[])).push(d);
  detSel=d.id;tab="det";setD(true);
  toast(i18n("Детектор добавлен"));gear();
}
function deleteDetector(camId,detId){
  const f=find(camId);if(!f)return;
  const d=camDetectors(f.n).find(x=>x.id===detId);if(!d)return;
  askConfirm("Удалить детектор?",`${i18n("Будет удалён")} «${escHtml(locName(d))}».`,i18n("Это действие нельзя отменить."),i18n("Удалить"),()=>{
    f.n.devices=f.n.devices.filter(x=>x.id!==detId);
    if(detSel===detId)detSel=null;
    setD(true);toast(i18n("Детектор удалён"));gear();
  });
}
// Зона детектора рисуется прямо на карточке, без отдельной вкладки
function detZoneShapeSvg(kind){
  if(kind==="Пересечение линии")
    return`<line x1="18" y1="78" x2="82" y2="30" stroke="var(--bl)" stroke-width="2" stroke-linecap="round"/>
      <path d="M50 54 l10 -13" stroke="var(--bl)" stroke-width="2" stroke-linecap="round" marker-end="url(#zar)"/>
      <circle cx="18" cy="78" r="2.6" fill="var(--bl)"/><circle cx="82" cy="30" r="2.6" fill="var(--bl)"/>`;
  if(kind==="Движение")
    return`<rect x="16" y="20" width="68" height="58" rx="2" fill="var(--bl)" fill-opacity=".14" stroke="var(--bl)" stroke-width="2"/>
      ${[[16,20],[84,20],[16,78],[84,78]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="2.6" fill="var(--bl)"/>`).join("")}`;
  return`<polygon points="22,72 34,26 70,22 84,58 58,80" fill="var(--pu)" fill-opacity=".14" stroke="var(--pu)" stroke-width="2" stroke-linejoin="round"/>
    ${[[22,72],[34,26],[70,22],[84,58],[58,80]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="2.6" fill="var(--pu)"/>`).join("")}`;
}
function detZoneCardHtml(cam,d){
  const kind=d.kind||DET_TYPES[0];
  return card("Зона",`<div class="vid" style="position:relative">
      <svg viewBox="0 0 100 100" preserveAspectRatio="none" style="position:absolute;inset:0;width:100%;height:100%">
        <defs><marker id="zar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--bl)"/></marker></defs>
        ${detZoneShapeSvg(kind)}
      </svg>
      <span class="sub" style="position:absolute;left:10px;bottom:8px">${escHtml(cam?locName(cam):"")} · ${escHtml(i18n(kind))}</span>
    </div>
    <div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap">
      <button class="btn s">${i18n("Прямоугольник")}</button><button class="btn s">${i18n("Полигон")}</button>
      <button class="btn s">${i18n("Линия")}</button><button class="btn s">${i18n("Сбросить")}</button>
    </div>`,
    `<span class="sub" style="font-weight:400">${escHtml(i18n(kind))}</span>`);
}
// Детектор считается на сервере; по умолчанию — там же, где архив камеры
function detServerSelectHtml(cam,d){
  const auto=srv(cam.id);
  const autoLb=auto?`${i18n("Как у архива")} — ${locName(auto)}`:i18n("Как у архива — не задан");
  return `<div><label>${i18n("Сервер детектора")}</label><select onchange="setDetServer('${cam.id}','${d.id}',this.value)">
    <option value="" ${!d.srvId?"selected":""}>${escHtml(autoLb)}</option>
    ${servers.filter(x=>!isUnallocated(x.id)).map(x=>`<option value="${x.id}" ${d.srvId===x.id?"selected":""}>${escHtml(locName(x))}${serverGpu(x)?" · GPU":""}</option>`).join("")}
  </select></div>`;
}
function detServerNoteHtml(cam,d){
  const sid=detServerId(cam,d),sv=sid?servers.find(x=>x.id===sid):null;
  if(!sv)return`<p class="sub">${i18n("Сервер не определён: у камеры не настроена запись, назначьте сервер детектора вручную.")}</p>`;
  const g=serverGpu(sv);
  return`<p class="sub">${i18n("Считается на сервере")} <b>${escHtml(locName(sv))}</b>${g?` · <button class="lk" onclick="openNode('${gpuId(sv.id)}')">${escHtml(g.model)} →</button>`:` · ${i18n("без видеоускорителя, расчёт на ЦПУ")}`}</p>`;
}
function camDetectorsHtml(n){
  const dets=camDetectors(n);
  const addBtn=`<button type="button" class="btn s" onclick="addDetector('${n.id}')">＋ ${i18n("Детектор")}</button>`;
  if(!dets.length)return card("Детекторы камеры",
    `<p class='sub'>${i18n("У камеры нет детекторов")}</p>
     <p class="sub">${i18n("Детектор считается на сервере, где ведётся запись, либо на самой камере, если она это умеет. События детектора доступны в")} <button class="lk" onclick="goApp('rules')">${i18n("Автоматизации")}</button>.</p>`,addBtn);
  const cur=dets.find(d=>d.id===detSel)||dets[0];
  const list=dets.map(d=>`<div class="it ${d.id===cur.id?"on":""}" onclick="detSel='${d.id}';gear()"><span>${ic("det")}</span><span>${escHtml(detTitle(d))}<small>${escHtml(i18n(d.kind||DET_TYPES[0]))}${d.builtin?" · "+i18n("на камере"):""}</small></span>${bdg(d)}</div>`).join("");
  return card("Детекторы камеры",list,addBtn)+
    card("Параметры детектора",`<div class="g">${fld("Имя",locName(cur))}${sl("Тип",DET_TYPES,cur.kind||DET_TYPES[0])}${fld("Чувствительность",cur.sens||"12")}${detServerSelectHtml(n,cur)}</div>
      <div class="ln ln-sw"><div>${i18n("Включён")}</div><div class="sw ${cur.online!==false?"on":""}" onclick="this.classList.toggle('on');setD(true)"></div></div>
      ${detServerNoteHtml(n,cur)}
      <p class="sub">${i18n("События детектора →")} <button class="lk" onclick="goApp('rules')">${i18n("Автоматизация")}</button></p>`,
      `<button type="button" class="btn s" onclick="deleteDetector('${n.id}','${cur.id}')">${i18n("Удалить")}</button>`)+
    detZoneCardHtml(n,cur);
}

let ws=1,wizd={};
// Устройство попадает в общий пул и в выбранную папку расположения
function wizardFolder(){
  const list=flatFolders();
  if(!wizd.folder||!list.some(f=>f.id===wizd.folder))
    wizd.folder=(selFolder&&folderById(selFolder)?selFolder:list[0]?.id)||null;
  return folderById(wizd.folder);
}
function deviceTarget(){
  const f=wizardFolder();
  return f?{id:f.id,type:"folder",name:f.name,devices:devicePool}:null;
}
function assignDeviceFolder(deviceId,folderId){
  const fid=folderId||wizd.folder;
  if(!fid||!deviceId)return;
  folderAddDevice(fid,deviceId);
}
function initDeviceWizard(c){
  return{
    mode:"device-add",deviceTab:"search",deviceStep:1,domain:c.domain?.id||domains[0]?.id,
    server:c.server?.id||null,folder:(c.node?.type==="folder"?c.node.id:selFolder)||null,serverOnly:false,view:c.view,
    devState:"idle",devSearchProgress:0,devFilter:"",devFiltPop:false,devSelectedOnly:false,devStatuses:{ok:true,manual:true,bad:true},
    devMode:"current",templateId:"",devResults:[],devFieldsPop:false,devViewMode:defaultDevViewMode(),devSelected:new Set(),
    bulkEditOpen:false,tplPop:false,modePop:false,tplFilter:"",bulkEdit:{vendor:"",model:"",user:"",pass:"",name:"",arch:"",group:"",record:""},
    bulkUser:"",bulkPass:"",
    manual:{type:"camera",ip:"",port:80,mac:"",vendor:"Hikvision",model:DEVICE_MODELS.Hikvision[0],user:"",pass:"",name:"",short:"",identifier:"",arch:arch[0]?.id||"",group:"",record:"motion",lat:"0",lon:"0",azimuth:"0"},
    csvRows:[],csvName:"",csvError:""
  };
}
function closeWizard(){
  document.getElementById("wiz").classList.remove("open");
  document.getElementById("wizDr").classList.remove("device-wizard");
  document.getElementById("wizDr").classList.remove("server-list");
  const df=document.querySelector("#wiz .df"),foot=document.getElementById("wizFoot");
  if(df)df.classList.remove("device-footer");
  if(foot)foot.innerHTML="";
  if(deviceSearchTimer){clearTimeout(deviceSearchTimer);deviceSearchTimer=null}
  stopDeviceSearch();
  document.removeEventListener("mousedown",onDeviceFiltOutside);
}
function stopDeviceSearch(){
  if(deviceSearchInterval){clearInterval(deviceSearchInterval);deviceSearchInterval=null}
}
function abortDeviceSearch(){
  if(wizd.devState!=="searching")return;
  stopDeviceSearch();
  wizd.devState="done";
  renderDeviceWizard();
}
function deviceArchiveWarning(){
  return arch.length?"":`<div class="archive-warning"><span>В системе не создано ни одного архива. Камеры можно добавить, но запись будет недоступна.</span><button type="button" class="lk" onclick="goDeviceArchives()">Перейти к архивам</button></div>`;
}
function goDeviceArchives(){closeWizard();goApp("hw");setSlice("cam");setGroupBy("server")}
function setDeviceTab(tab){
  wizd.deviceTab=tab;
  if(tab==="search")wizd.deviceStep=1;
  renderDeviceWizard();
}
function goDeviceStep(step){
  if(step===1){wizd.deviceStep=1;renderDeviceWizard();return}
  proceedToDeviceStep2();
}
function removeFoundDevice(id){
  const r=wizd.devResults.find(x=>x.id===id);
  if(!r||r.added)return;
  wizd.devResults=wizd.devResults.filter(x=>x.id!==id);
  wizd.devSelected.delete(id);
  renderDeviceWizard();
}
function proceedWithDevice(id){
  const r=wizd.devResults.find(x=>x.id===id);
  if(!r||r.added||r.status==="bad")return;
  const err=foundConnectionError(r);
  if(err){toast(err);return}
  wizd.devSelected.clear();wizd.devSelected.add(id);
  addSelectedFoundDevices();
}
function proceedToDeviceStep2(){
  addSelectedFoundDevices();
}
function deviceViewMode(){
  return wizd.devViewMode||defaultDevViewMode();
}
function setDeviceViewMode(mode){
  wizd.devViewMode=mode;
  renderDeviceWizard();
}
function toggleDeviceFieldsPop(e){
  e.stopPropagation();
  wizd.devFieldsPop=!wizd.devFieldsPop;
  if(wizd.devFieldsPop){wizd.devFiltPop=false;wizd.modePop=false;wizd.tplFilter=""}
  renderDeviceWizard();
}
function configuredDevices(){
  const out=[];domains.forEach(d=>d.servers.forEach(s=>walk(n=>{if(["camera","ipsrv","eventsrc","acfa"].includes(n.type))out.push(n)},s.devices,s)));return out;
}
function exactDeviceDuplicate(r){
  return configuredDevices().some(n=>n.ip===r.ip&&+(n.port||80)===+(r.port||80)&&n.mac&&r.mac&&n.mac.toLowerCase()===r.mac.toLowerCase());
}
function addressDeviceDuplicate(r){
  return configuredDevices().some(n=>n.ip===r.ip&&+(n.port||80)===+(r.port||80)&&(!n.mac||!r.mac||n.mac.toLowerCase()!==r.mac.toLowerCase()));
}
function deviceTemplates(){
  const s=deviceTarget(),out=[];
  if(!s)return out;
  walk(n=>{if(n.type==="camera"&&n.model)out.push(n)},s.devices||[],s);
  return out;
}
function deviceFilterMatch(r,q){
  if(textHit([r.ip,r.vendor,r.model,r.name,r.mac].filter(Boolean).join(" "),q))return true;
  if(!r.mac)return false;
  const mq=q.replace(/[^a-f0-9]/gi,"");
  if(mq.length<2)return false;
  return String(r.mac).toLowerCase().replace(/[^a-f0-9]/g,"").includes(mq);
}
function visibleDeviceResults(){
  const q=(wizd.devFilter||"").trim().toLowerCase();
  return wizd.devResults.filter(r=>{
    if((!r.added&&exactDeviceDuplicate(r))||!wizd.devStatuses[r.status])return false;
    return!q||deviceFilterMatch(r,q);
  });
}
function deviceSelectedOnlyActive(){
  return!!wizd.devSelectedOnly&&wizd.devSelected.size>0;
}
function setDeviceSelectedOnly(v){
  wizd.devSelectedOnly=!!v&&wizd.devSelected.size>0;
  renderDeviceWizard();
}
function toggleDeviceSelectedOnly(){
  setDeviceSelectedOnly(!deviceSelectedOnlyActive());
}
function listDeviceResults(){
  const rows=visibleDeviceResults();
  if(deviceSelectedOnlyActive())return rows.filter(r=>wizd.devSelected.has(r.id));
  return rows;
}
function activeTemplateModel(){
  if(wizd.devMode!=="template"||!wizd.templateId)return"";
  const tpl=deviceTemplates().find(x=>x.id===wizd.templateId);
  return tpl?.model||"";
}
function deviceProfileFilterNoteHtml(){
  if(wizd.devMode!=="template"||!wizd.templateId)return"";
  const selected=deviceTemplates().find(t=>t.id===wizd.templateId);
  if(!selected)return"";
  const label=templateCameraLabel(selected);
  return `<div class="dev-profile-note" role="status">
    <span>Показаны только результаты, соответствующие выбранному профилю <b>${escHtml(label)}</b>.</span>
    <button type="button" class="lk" onclick="setDeviceMode('current')" title="Сбросить профиль при добавлении">Сбросить профиль</button>
  </div>`;
}
function pruneSelectionToVisible(){
  const vis=new Set(visibleDeviceResults().map(r=>r.id));
  [...wizd.devSelected].forEach(id=>{if(!vis.has(id))wizd.devSelected.delete(id)});
  if(!wizd.devSelected.size)wizd.devSelectedOnly=false;
}
function setDeviceFilter(v){
  const pos=document.activeElement?.selectionStart;wizd.devFilter=v;renderDeviceWizard();
  const el=document.getElementById("devFilter");if(el){el.focus();if(pos!=null)el.setSelectionRange(pos,pos)}

function hasDeviceStatusFilter(){
  const s=wizd.devStatuses;return !s.ok||!s.manual||!s.bad;
}
function toggleDeviceFiltPop(e){
  e.stopPropagation();

  if(wizd.devFiltPop){wizd.modePop=false;wizd.devFieldsPop=false;wizd.tplFilter=""}

function identifierTaken(server,value,excludeNodeId){

  walk(n=>{
    if(!["camera","ipsrv","eventsrc","acfa"].includes(n.type)||n.id===excludeNodeId)return;
    if(deviceIdentifierValue(n)===id)taken=true;
  },server.devices||[],server);

function identifierConflict(list,server){

    if(ids.has(id))return`ID «${id}» указан несколько раз`;
    ids.add(id);

function splitCsvLine(line){
  const out=[];let cur="",quote=false;
  for(let i=0;i<line.length;i++){const c=line[i];
    if(c==='"'){quote=!quote;continue}
    if(c==="\\"&&line[i+1]===","){cur+=",";i++;continue}
    if(c===","&&!quote){out.push(cur.trim());cur="";continue}
    cur+=c;
  }
  out.push(cur.trim());return out;
}
function decodeCsvBuffer(buf){

    const v=new DataView(buf),chars=[];for(let i=4;i+3<b.length;i+=4)chars.push(String.fromCodePoint(v.getUint32(i,true)));return chars.join("");
  }
  if(b.length>=4&&b[0]===0&&b[1]===0&&b[2]===0xfe&&b[3]===0xff){
    const v=new DataView(buf),chars=[];for(let i=4;i+3<b.length;i+=4)chars.push(String.fromCodePoint(v.getUint32(i,false)));return chars.join("");
  }
  return new TextDecoder("utf-8").decode(b).replace(/^\uFEFF/,"");
}

function parseCsvDeviceRows(text){

const IP_LIMIT=1024;
function ipToInt(s){
  const p=String(s).split(".");if(p.length!==4)return null;
  let n=0;for(const x of p){if(!/^\d{1,3}$/.test(x)||+x>255)return null;n=n*256+ +x}
  return n;
}
function intToIp(n){return[n>>>24&255,n>>>16&255,n>>>8&255,n&255].join(".")}
// 10.0.0.5 · 10.0.0.5:20112 · 10.0.0.20-40 · 10.0.0.20-10.0.1.10 · 10.0.1.0/24
function parseIpList(text,defPort){
  const items=[],bad=[],seen=new Set();let over=false;
  const push=(ip,port)=>{const k=ip+":"+port;if(seen.has(k))return;if(items.length>=IP_LIMIT){over=true;return}seen.add(k);items.push({ip,port})};
  for(const raw of String(text||"").split(/[\s,;]+/).filter(Boolean)){
    if(over)break;
    let tok=raw,port=defPort,m;
    if((m=tok.match(/^(.*\d):(\d{1,5})$/))){tok=m[1];port=+m[2];if(port<1||port>65535){bad.push(raw);continue}}
    if((m=tok.match(/^([\d.]+)\/(\d{1,2})$/))){
      const base=ipToInt(m[1]),bits=+m[2];
      if(base==null||bits<16||bits>32){bad.push(raw);continue}
      const size=2**(32-bits),start=Math.floor(base/size)*size;
      // Адрес сети и широковещательный не опрашиваем
      const from=size>2?start+1:start,to=size>2?start+size-2:start+size-1;
      for(let i=from;i<=to&&!over;i++)push(intToIp(i),port);
      continue;
    }
    if((m=tok.match(/^([\d.]+)-([\d.]+)$/))){
      const a=ipToInt(m[1]),short=!m[2].includes(".");
      const b=a==null?null:short?(+m[2]<=255?Math.floor(a/256)*256+ +m[2]:null):ipToInt(m[2]);
      if(a==null||b==null||b<a){bad.push(raw);continue}
      for(let i=a;i<=b&&!over;i++)push(intToIp(i),port);
      continue;
    }
    const n=ipToInt(tok);
    if(n==null){bad.push(raw);continue}
    push(intToIp(n),port);
  }
  return{items,bad,over};
}

function probeServer(ip,port){
  const s=knownServers().find(x=>x.ip===ip&&(x.port||20111)===port);
  if(s){
    const dom=domainOf(s.id);
    if(dom)return{st:"taken",server:s,dom};
    return{st:"unalloc",server:s,dom:domains.find(d=>d.id===unallocDomainOf(s.id))};
  }

  return(o[3]*7+o[2]*3+port)%5===0?{st:"missing"}:{st:"new"};

  }else if(ws===1){
    h+=`<div class="wsec">Тип объекта</div>`;
    Object.entries(WIZ).forEach(([cat,blk])=>{
      if(blk.view!==wizd.view||(wizd.lockedCat&&wizd.lockedCat!==cat))return;
      h+=`<div style="margin-bottom:10px"><b style="font-size:12px;color:var(--mu)">${blk.label}</b>
        <div class="g" style="margin-top:6px">${blk.types.map(([id,n,d])=>`<button type="button" class="chc ${wizd.mode==="object"&&wizd.type===id?"on":""}" onclick="chooseAdd('object','${cat}','${id}')"><b>${n}</b><small>${d}</small></button>`).join("")}</div></div>`;
    });
    if(!wizd.mode)h+=`<p class="sub">Выберите, что нужно добавить.</p>`;
  }else if(wizd.mode==="server-manual"){
    h+=wizDomainPick();
    if(manualRes)h+=ipResultsHtml();
    else{
      h+=`<label for="wizIps">${i18n("IP-адреса")}</label>
        <textarea id="wizIps" class="ip-list" rows="7" spellcheck="false" placeholder="10.30.0.12&#10;10.30.0.20-40&#10;10.30.1.0/28&#10;10.30.2.5:20112"
          oninput="ipCountHint()" onkeydown="if(event.key==='Enter'&&(event.ctrlKey||event.metaKey)){event.preventDefault();runIpSearch()}">${escHtml(wizd.ipText||"")}</textarea>
        <div class="ip-list-foot"><span class="sub" id="wizIpsCnt"></span><span class="sub">Ctrl+Enter — ${i18n("найти")}</span></div>
        <p class="sub" style="margin:6px 0 10px">${i18n("По одному на строку, через запятую или пробел. Диапазон: 10.30.0.20-40 или 10.30.0.20-10.30.1.10. Подсеть: 10.30.1.0/24. Свой порт: 10.30.0.5:20112. За раз — до 1024 адресов.")}</p>
        <div class="g"><div><label>${i18n("Порт по умолчанию")}</label><input id="wizPort" type="number" min="1" max="65535" value="${wizd.searchPort||20111}" oninput="ipCountHint()"></div></div>
        ${wizd.searchMsg?`<div class="nt err" style="margin-top:10px">${escHtml(wizd.searchMsg)}</div>`:""}`;
    }
  }else{
    const svcFlow=wizd.view==="sys"||wizd.cat==="svc";
    const list=svcFlow?wizardServerOptions():[];
    const s=svcFlow?list.find(x=>x.id===wizd.server):deviceTarget();
    const label=WIZ[wizd.cat]?.types.find(t=>t[0]===wizd.type)?.[1]||"Объект";
    h+=`<div class="wsec">Куда добавить</div>`;
    if(svcFlow&&!list.length)h+=`<div class="nt">Сначала добавьте сервер в домен.</div>`;
    else if(!svcFlow&&!flatFolders().length)h+=`<div class="nt">Сначала создайте папку в разделе «Устройства».</div>`;
    else{
      h+=svcFlow
        ?`<div class="g"><div><label>Сервер</label><select id="wizServer" onchange="wizd.server=this.value;wizd.parentId=null;wd()">
        ${list.map(x=>`<option value="${x.id}" ${x.id===wizd.server?"selected":""}>${x.name} · ${x.ip||"без IP"}</option>`).join("")}</select></div>`
        :`<div class="g"><div><label>Папка</label><select id="wizFolder" onchange="wizd.folder=this.value;wizd.parentId=null;wd()">
        ${folderOptionGroups(wizd.folder)}</select></div>`;
      if(needsParent(wizd.type)){
        const opts=parentOpts(s,wizd.type);
        if(!wizd.parentId||!opts.some(o=>o.id===wizd.parentId))wizd.parentId=opts[0]?.id||null;
        h+=`<div><label>Родительский объект</label><select id="wizParent" onchange="wizd.parentId=this.value">
          ${opts.length?opts.map(o=>`<option value="${o.id}" ${o.id===wizd.parentId?"selected":""}>${o.name} (${LB[o.type]})</option>`).join(""):`<option value="">Нет подходящих объектов</option>`}</select></div>`;
      }
      h+=`</div><div class="wsec">Параметры: ${label}</div><div class="g">
        <div><label>Имя</label><input id="wizName" value="Новый ${label.toLowerCase()}"></div>
        ${["camera","ipsrv-nvr","ipsrv-io","ipsrv-sip","ipsrv-mic","eventsrc","acfa"].includes(wizd.type)?`<div><label>IP-адрес</label><input id="wizObjIp" value="192.168.1.50"></div>`:""}
        ${wizd.type==="export"?`<div><label>Папка</label><input id="wizPath" value="D:\\Export"></div>`:""}
        ${wizd.type==="email"?`<div><label>SMTP</label><input id="wizSmtp" value=""></div>`:""}
        ${needsParent(wizd.type)&&wizd.view==="cam"?`<div><label>Канал</label><input id="wizChannel" type="number" value="1"></div>`:""}
      </div>`;
    }
  }
  document.getElementById("wbd").innerHTML=h;
}
function wnx(){
  if(wizd.mode==="device-add")return;
  if(ws===1){
    if(!wizd.mode){toast("Выберите, что нужно добавить");return}
    ws=2;wd();return;
  }
  if(wizd.mode==="server-manual"){
    if(wizd.ipPhase==="results"){addIpResults();return}
    runIpSearch();return;
  }
  const svcFlow=wizd.view==="sys"||wizd.cat==="svc";
  const s=svcFlow?domains.flatMap(d=>d.servers).find(x=>x.id===wizd.server):deviceTarget();
  if(!s){toast(svcFlow?"Выберите сервер":"Выберите папку");return}
  if(needsParent(wizd.type)&&!wizd.parentId){toast("Нет подходящего родительского объекта");return}
  const rawType=wizd.type,type=rawType.startsWith("ipsrv-")?"ipsrv":rawType,subtype=rawType.startsWith("ipsrv-")?rawType.slice(6):null;
  const name=(document.getElementById("wizName")||{}).value?.trim()||"Новый объект";
  const id="obj"+Date.now(),node={id,type,name,online:true,devices:[]};
  if(subtype)node.subtype=subtype;
  const ip=(document.getElementById("wizObjIp")||{}).value?.trim();if(ip)node.ip=ip;
  const ch=(document.getElementById("wizChannel")||{}).value;if(ch!=="undefined"&&ch!=null&&ch!=="")node.ch=+ch;
  if(rawType==="export")node.path=(document.getElementById("wizPath")||{}).value||"D:\\Export";
  if(rawType==="email")node.smtp=(document.getElementById("wizSmtp")||{}).value||"";
  if(rawType==="spk")node.server=true;
  const parent=wizd.parentId?find(wizd.parentId)?.n:s;
  (parent.devices||(parent.devices=[])).push(node);
  if(!svcFlow&&!wizd.parentId)assignDeviceFolder(id,wizd.folder);
  if(rawType==="acfa"||ACFA_NODE_IDS.has(parent.id))ACFA_NODE_IDS.add(id);
  open.add(parent.id);sel=id;tab="gen";treeMatchCache.clear();searchMatchCache.clear();
  document.getElementById("wiz").classList.remove("open");toast(name+" добавлен");paint();
}
// Стрелки по дереву: ↑↓ — соседняя строка, → раскрыть, ← свернуть
// Ярлыки избранного из обхода стрелками исключаем: клик по ним уводит в другой срез
function treeRows(){return[...document.querySelectorAll("#tree .n:not(.n-add):not(.n-empty):not(.fav-head):not(.fav-row):not(.fav-more)")].filter(el=>el.dataset.pick||el.onclick)}
function treeMove(dir,fromSearch){
  const rows=treeRows();if(!rows.length)return;
  let i=rows.findIndex(el=>el.classList.contains("on"));
  if(fromSearch){const h=rows.findIndex(el=>el.classList.contains("qhit"));i=h>=0?h:0}
  else i=i<0?0:Math.max(0,Math.min(rows.length-1,i+dir));
  const row=rows[i];
  if(row.dataset.pick)pick(row.dataset.pick,{ctx:row.dataset.ctx});else row.click();
  scrollSelIntoView();
}
function treeFold(expand){
  const row=document.querySelector("#tree .n.on[data-tid]");if(!row)return;
  const id=row.dataset.tid,isOpen=row.querySelector(".tw")?.textContent.trim()==="▾";
  if(expand!==isOpen)treeToggleId(id);
}
function inTextField(t){return!!t?.closest?.("input,textarea,select,[contenteditable]")}
function overlayOpen(){return["wiz","confirm"].some(id=>document.getElementById(id)?.classList.contains("open"))}
// Боковую панель пересобираем при смене раздела, среза или группировки — в ней их кнопки
function paint(){const key=app+"|"+viewKey();if(_lastApp!==key){aside();_lastApp=key}else renderTree();
  const ui={hw:gear,rules:rulesUI,acc:accUI,sys:sysUI,log:logUI};
  (ui[app]||gear)();
  if(app!=="hw")syncDomAct();
  syncNavActive();
}
function upd(){paint()}
const rsz=document.getElementById("rsz");let drag=false,asideUserW=false;
rsz.onmousedown=e=>{drag=true;asideUserW=true;rsz.classList.add("on");e.preventDefault()};
// Пока ширину не тянули руками, панель остаётся четвертью окна
window.addEventListener("resize",()=>{
  if(asideUserW)return;
  asideW=clampAsideW(window.innerWidth/4);
  document.getElementById("ws")?.style.setProperty("--aw",asideW+"px");
});
window.onmousemove=e=>{if(!drag)return;
  const railW=document.getElementById("rail")?.offsetWidth||0;
  asideW=clampAsideW(e.clientX-railW);document.getElementById("ws").style.setProperty("--aw",asideW+"px");if(filtPop)placeFiltPop()};
window.onmouseup=()=>{drag=false;rsz.classList.remove("on")};
document.onkeydown=e=>{if((e.ctrlKey||e.metaKey)&&e.key==="k"){e.preventDefault();openJump()}
  if(document.getElementById("confirm")?.classList.contains("open")){
    if(e.key==="Escape"){e.preventDefault();closeConfirm();return}
    if(e.key==="Enter"){e.preventDefault();runConfirmOk();return}
  }
  if(e.key==="Escape"){closeJump();closeTreeCtx();if(treeSel.size>1){clearTreeSel()}}
  if((e.key==="Delete"||e.key==="Backspace")&&treeSel.size>1&&app==="hw"&&!e.target.closest("input,textarea,select")){e.preventDefault();deleteSelected()}
  if(inTextField(e.target)||overlayOpen()||e.ctrlKey||e.metaKey||e.altKey)return;
  if(e.key==="/"){const q=document.getElementById("q");if(q){e.preventDefault();q.focus();q.select()}return}
  if(e.key==="f"||e.key==="F"||e.key==="а"||e.key==="А"){e.preventDefault();toggleFavSel();return}
  if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();treeMove(e.key==="ArrowDown"?1:-1);return}
  if(e.key==="ArrowRight"||e.key==="ArrowLeft"){e.preventDefault();treeFold(e.key==="ArrowRight")}
};
document.addEventListener("mousedown",e=>{if(!e.target.closest("#tctx"))closeTreeCtx()});
// Индекс find() сбрасываем до обработчиков: действие могло изменить модель
["mousedown","click","input","change","keydown","drop"].forEach(t=>window.addEventListener(t,invalidateFind,true));
syncLocalePack();applyStaticUi();
if(!applyDeepLink()){resetTreeSel(sel);paint();}
</script>
